# Doloyal API — Render Blueprint
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file, creates the service, and prompts for every value
# marked `sync: false`. Nothing secret is stored in this file.
#
# The web app stays on Vercel. The browser calls same-origin
# https://doloyal.com/backend/* and Vercel proxies that to this service, so
# this service's URL must be set as API_BASE_URL in the Vercel project.
#
# Node version comes from .nvmrc (22). Package manager comes from the
# `packageManager` field in the root package.json (pnpm).

services:
  - type: web
    name: doloyal-api
    runtime: node
    plan: starter # Free plan sleeps after 15 min idle; the first request then
      # takes ~50s and the dashboard appears to hang. Use starter or above.
    region: singapore # Closest region to the India-focused user base.
    branch: main
    autoDeploy: true

    # Root postinstall runs `prisma generate`, so the Prisma Client is built
    # before tsc compiles against it.
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: node apps/api/dist/main.js

    # Applies pending Prisma migrations before the new version takes traffic.
    # This is forward-only (`migrate deploy`) — it never resets or drops data.
    # Requires a paid instance type; on the free plan, remove this line and run
    # migrations manually (see DEPLOYMENT.md).
    preDeployCommand: pnpm --filter @doloyal/api exec prisma migrate deploy

    # Public, unauthenticated, always 200 — reports DB reachability in the body.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT itself; main.ts binds to it.

      # Supabase pooler URL (port 6543, ?pgbouncer=true) for the running app.
      - key: DATABASE_URL
        sync: false
      # Supabase direct URL (port 5432) — Prisma uses this for migrations only.
      - key: DIRECT_URL
        sync: false

      # Must be >= 32 chars. The API refuses to boot in production otherwise.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Encrypts stored integration credentials and OAuth tokens at rest.
      # WARNING: changing this value orphans every already-encrypted secret.
      - key: ENCRYPTION_KEY
        generateValue: true

      # Apex is canonical; www is kept so the redirect hop and any stale
      # bookmarks still pass CORS preflight.
      - key: CORS_ORIGIN
        value: https://doloyal.com,https://www.doloyal.com
      # Canonical public origin. Used to build booking links, client pages,
      # referral links, password-reset links and OAuth redirect URIs.
      - key: APP_URL
        value: https://doloyal.com

      # Required for login: the API verifies Supabase-issued access tokens.
      # These keep the NEXT_PUBLIC_ prefix because that is the name the API
      # code reads; they are the same public values the web app uses.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # The service-role key also authorises media uploads to Supabase
      # Storage. Without it, product and review image uploads fail with a
      # clear configuration error rather than writing to a disk that Render
      # wipes on every deploy.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: doloyal-media

      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false

      - key: WEBSITE_AI_PROVIDER
        value: nvidia
      - key: WEBSITE_AI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: WEBSITE_AI_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: WEBSITE_AI_API_KEY
        sync: false

      # Per-business sending uses Resend OAuth (no platform key). RESEND_API_KEY
      # is separate and powers platform auth mail only: password resets and
      # staff invites. Without it those send attempts fail silently.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_OAUTH_CLIENT_ID
        sync: false
      - key: RESEND_FROM
        sync: false

      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://doloyal.com/app/integrations/callback

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false

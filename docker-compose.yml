services:
  postgres:
    image: postgres:16-alpine
    container_name: doloyal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doloyal
    ports:
      - "5432:5432"
    volumes:
      - doloyal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doloyal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  doloyal_pgdata:
